[tools]
dprint = "latest"
uv = "latest"

[tasks.test]
description = "Run test script"
alias = "t"
run = "./test.sh"

[tasks.check]
description = "Run pre-commit checks and format code"
alias = "c"
run = [
    "uv tool run --with pre-commit-uv pre-commit run -a",
    "cargo fmt",
]

[tasks.update]
description = "Update dependencies and tools"
alias = "u"
run = [
    "dprint config update",
    "cargo update",
    "uv tool run --with pre-commit-uv pre-commit autoupdate",
]
depends_post = ["check"]

[tasks.package]
description = "Create a package after cleaning build artifacts"
run = [
    "cargo clean",
    "cargo package --allow-dirty",
]

[tasks.doc]
description = "Generate docs"
run = "cargo +nightly rustdoc -- --cfg docsrs"

[tasks.bump]
description = "Bump package version number"
alias = "b"
run = "uv tool run bump-my-version bump"
depends_post = ["package", "doc"]
